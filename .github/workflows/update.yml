name: Auto Update TVBox Configs

# 注意：GitHub Actions 的 on 字段需加引号，避免被部分 YAML 解析器当作布尔值
"on":
  # 定时触发：每天 03:00、09:00 和 19:00（UTC）自动更新
  schedule:
    - cron: "0 3,9,19 * * *"
  # 支持在 GitHub Actions 页面手动触发
  workflow_dispatch:
  # 修改配置或脚本后 push 时触发（仅监听 config/scripts，避免自动提交 output/ 引发死循环）
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

# 赋予 GITHUB_TOKEN 写仓库权限，用于把更新结果提交回仓库
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: auto-update
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate and publish configs
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            base=$(git rev-parse FETCH_HEAD)
            git switch --detach "$base"
            python -m pip install -r requirements.txt
            python scripts/update.py
            git add -A -- output/ source-cache/
            if git diff --cached --quiet; then
              echo "::notice::没有内容变化，跳过提交"
              exit 0
            fi

            git commit -m "chore: 自动更新影视仓配置 $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            if git push origin HEAD:refs/heads/main; then
              echo "::notice::配置已更新并推送到 main 分支"
              exit 0
            fi

            git fetch origin main
            if [[ $(git rev-parse FETCH_HEAD) == "$base" ]]; then
              echo "::error::推送失败，远程 main 未变动"
              exit 1
            fi
            echo "::warning::远程 main 已变动，第 $attempt 次发布未成功"
          done

          echo "::error::重试两次后仍无法发布配置"
          exit 1
