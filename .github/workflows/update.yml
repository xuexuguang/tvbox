name: Auto Update TVBox Configs

# 注意：GitHub Actions 的 on 字段需加引号，避免被部分 YAML 解析器当作布尔值
"on":
  # 定时触发：每天 03:00、09:00 和 19:00（UTC）自动更新
  schedule:
    - cron: "0 3,9,19 * * *"
  # 支持在 GitHub Actions 页面手动触发
  workflow_dispatch:
  # 修改输入或管理页时触发，生成文件由工作流提交
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "scripts/**"
      - "manage/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

concurrency:
  group: update-and-deploy-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate and publish configs
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            base=$(git rev-parse FETCH_HEAD)
            git switch --detach "$base"
            python -m pip install -r requirements.txt
            python scripts/update.py
            git add -A -- output/ source-cache/
            if git diff --cached --quiet; then
              echo "::notice::没有内容变化，跳过提交"
              exit 0
            fi

            git commit -m "chore: 自动更新影视仓配置 $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            if git push origin HEAD:refs/heads/main; then
              echo "::notice::配置已更新并推送到 main 分支"
              exit 0
            fi

            git fetch origin main
            if [[ $(git rev-parse FETCH_HEAD) == "$base" ]]; then
              echo "::error::推送失败，远程 main 未变动"
              exit 1
            fi
            echo "::warning::远程 main 已变动，第 $attempt 次发布未成功"
          done

          echo "::error::重试两次后仍无法发布配置"
          exit 1

      - name: Prepare Pages files
        run: |
          site="$RUNNER_TEMP/tvbox-pages"
          mkdir -p "$site/manage" "$site/config" "$site/output"
          cp manage/index.html manage/app.js manage/style.css "$site/manage/"
          cp config/sources.json "$site/config/"
          cp output/*.json "$site/output/"
          cat > "$site/index.html" <<'EOF'
          <!doctype html>
          <html lang="zh-CN">
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=manage/">
          <title>TVBox 源管理</title>
          <a href="manage/">打开 TVBox 源管理</a>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/tvbox-pages

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
